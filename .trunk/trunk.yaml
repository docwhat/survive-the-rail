# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.10.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
    - rust@1.88.0
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  files:
    - name: gdscript
      extensions:
        - gd
      comments:
        - hash
  ignore:
    - linters: [ALL]
      paths:
        - addons/**
  enabled:
    - checkov@3.2.531
    - markdownlint@0.48.0
    - trufflehog@3.95.3
    - actionlint@1.7.12
    - git-diff-check
    - oxipng@10.1.1
    - prettier@3.8.3
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - taplo@0.10.0
    - yamllint@1.38.0
    - gdscript-formatter@0.18.2
  definitions:
    - name: gdscript-formatter
      description: Formats GDScript (Godot's scripting language)
      files: [gdscript]
      tools: [gdscript-formatter]
      known_good_version: 0.18.0
      suggest_if: files_present
      commands:
        - name: lint
          run: gdscript-formatter lint ${target}
          output: regex
          batch: true
          # bad.gd:15:unused-argument:warning: Function argument 'argument' is unused. Consider removing it or prefixing with '_'
          parse_regex: ((?P<path>[^:]+):(?P<line>\d+):(?P<code>[^:]+):(?P<severity>[^:]+):\s*(?P<message>.*))

          success_codes: [0, 1]
          read_output_from: stdout
        - name: formatter
          output: rewrite
          formatter: true
          run: gdscript-formatter --safe --stdout ${target}
          success_codes: [0]
      version_command:
        parse_regex: ${semver}
        run: gdscript-formatter --version
actions:
  disabled:
    - commitizen
  enabled:
    - commitlint
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
tools:
  definitions:
    - name: gdscript-formatter
      runtime: rust
      package: gdscript-formatter:https://github.com/gdquest/gdscript-formatter.git
      shims:
        - name: gdscript-formatter
          target: gdscript-formatter
      # Requires rust 1.88.0 at minumum
      known_good_version: 0.18.0
      health_checks:
        - command: gdscript-formatter --version
          parse_regex: ${semver}
